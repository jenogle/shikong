<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>失控事務所積分錦標賽</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff4757;
            --table-header: #2f3542;
            --table-hover: #2d2d2d;
            --dirty-color: #ffa502;
        }

        body {
            font-family: 'Share Tech Mono', 'Noto Sans TC', monospace, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
            letter-spacing: 2px;
            text-align: center;
        }

        h2 {
            color: #ffa502;
            font-size: 1.4rem;
            margin: 25px 0 10px 0;
            align-self: flex-start;
            width: 100%;
            max-width: 1150px;
            letter-spacing: 1px;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        .container {
            width: 100%;
            max-width: 1150px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            box-sizing: border-box;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        /* 頂部設定/控制列 */
        .config-bar {
            width: 100%;
            max-width: 1150px;
            background-color: #2f3542;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            flex-wrap: wrap;
            gap: 15px;
        }

        .config-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .config-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .config-bar label, .setup-container label {
            font-weight: bold;
            color: #ffa502;
            font-size: 1rem;
        }

        input, select {
            background-color: #121212;
            border: 1px solid #555;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            font-family: inherit;
        }

        select {
            color: #1e90ff;
            cursor: pointer;
        }

        .config-bar input {
            width: 60px;
            text-align: center;
        }

        /* 名單設置表單區塊樣式 */
        .setup-toggle-btn {
            background-color: #3e4452;
            color: #fff;
            width: 100%;
            max-width: 1150px;
            text-align: left;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            border: 1px dashed #555;
        }
        
        .setup-container {
            display: none; 
            width: 100%;
            max-width: 1150px;
            background-color: #1c222d;
            border: 1px solid #2ed573;
            padding: 20px;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .player-input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .player-input-row input[type="text"] { width: 200px; }
        .player-input-row input[type="number"] { width: 100px; text-align: center; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 1.1rem;
        }

        th, td {
            padding: 14px 10px;
            border-bottom: 1px solid #333;
            vertical-align: middle;
            white-space: nowrap;
        }

        th {
            background-color: var(--table-header);
            color: #ffa502;
            font-weight: bold;
            letter-spacing: 1px;
        }

        th.sort-indicator-header {
            color: #2ed573;
            text-shadow: 0 0 5px rgba(46, 213, 115, 0.3);
        }

        tbody tr {
            transition: background-color 0.15s;
        }

        tbody tr:hover {
            background-color: var(--table-hover);
        }

        .dirty-cell {
            background-color: rgba(255, 165, 2, 0.15) !important;
            border: 2px dashed var(--dirty-color) !important;
            border-radius: 6px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        .rank-1 { color: #ffd700; font-weight: bold; font-size: 1.4rem; text-shadow: 0 0 5px rgba(255,215,0,0.3); }
        .rank-2 { color: #c0c0c0; font-weight: bold; font-size: 1.25rem; }
        .rank-3 { color: #cd7f32; font-weight: bold; font-size: 1.15rem; }
        
        .hp-bar-container {
            width: 80px;
            background-color: #444;
            border-radius: 4px;
            display: inline-block;
            margin-left: 8px;
            vertical-align: middle;
            overflow: hidden;
        }
        .hp-bar {
            height: 10px;
            background-color: #2ed573;
            transition: width 0.2s ease;
        }

        .round-cell {
            color: #1e90ff;
            font-weight: bold;
        }
        .round-cell.has-value {
            color: #ffa502;
        }

        .action-btns {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            border: none;
            border-radius: 4px;
            padding: 7px 14px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
            font-size: 0.9rem;
            font-family: inherit;
        }

        button:active { transform: scale(0.95); }
        button:hover { opacity: 0.9; }

        .btn-hp-add { background-color: #2ed573; color: #000; }
        .btn-hp-sub { background-color: #ff4757; }
        .btn-pt-add { background-color: #1e90ff; }
        .btn-pt-sub { background-color: #ff6348; }
        .btn-add-round { background-color: #2ed573; color: #000; }
        .btn-edit { background-color: #57606f; }
        .btn-reset { background-color: #57606f; color: #fff; padding: 6px 10px; font-size: 0.85rem;}
        .btn-danger { background-color: #ff4757; }
        .btn-success { background-color: #2ed573; color: #000; }
        
        .btn-submit-all {
            background-color: #ffa502;
            color: #000;
            font-size: 1rem;
            padding: 8px 20px;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(255, 165, 2, 0.4);
        }
        .btn-submit-all.glow {
            animation: buttonGlow 1s infinite alternate;
            background-color: #2ed573;
        }
        @keyframes buttonGlow {
            from { box-shadow: 0 0 5px #2ed573; }
            to { box-shadow: 0 0 20px #2ed573, 0 0 10px #2ed573; }
        }

    </style>
</head>
<body>

    <h1>失控事務所積分錦錦標賽</h1>

    <button class="setup-toggle-btn" onclick="toggleSetupSection()">👥 點此展開/收合：名單與初始血量設定表單</button>
    <div id="setup-section" class="setup-container">
        <h3 style="margin-top:0; color:#2ed573;">🛠️ 撰寫本次參賽名單與命數 (初始血量)</h3>
        <p style="color:#aaa; font-size:0.9rem; margin-bottom:15px;">提示：導入新名單會重置當前對戰紀錄，請在賽事開始前設定完成。</p>
        
        <div id="player-inputs-list">
            </div>
        
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button type="button" class="btn-edit" onclick="addPlayerInputRow('', 11)">➕ 追加新參賽者</button>
            <button type="button" class="btn-success" onclick="importCustomNewTournament()">🔥 導入名單並開啟新賽局</button>
        </div>
    </div>

    <div class="config-bar">
        <div class="config-left">
            <div class="config-item">
                <label for="max-hp-input">🩸 血量顯示上限：</label>
                <input type="number" id="max-hp-input" value="11" min="1" oninput="updateMaxHp(this.value)">
            </div>
            
            <div class="config-item">
                <label for="round-select">🎮 目前管理局數：</label>
                <select id="round-select" onchange="changeCurrentRound(this.value)">
                    </select>
            </div>

            <button class="btn-add-round" onclick="addNewRound()">➕ 新增局數</button>
            <button class="btn-reset" onclick="resetToDefault()">🔄 全賽局重設</button>
        </div>
        
        <button id="main-submit-btn" class="btn-submit-all" onclick="commitChanges()">🚀 確定發布變更</button>
    </div>

    <h2>⚔️ 實時對戰操作面板 (按下發布變更後依血量及積分刷新排序)</h2>
    <div class="container">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>參賽者</th>
                        <th class="sort-indicator-header">血量 (▼1)</th>
                        <th class="sort-indicator-header">已獲得積分 (▼2)</th>
                        <th>名次</th>
                        <th>操作 (僅修改暫存，不影響目前排行)</th>
                    </tr>
                </thead>
                <tbody id="top-table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <h2>📊 各局得分明細數據大表</h2>
    <div class="container">
        <div class="table-wrapper">
            <table>
                <thead id="bottom-table-head">
                    </thead>
                <tbody id="bottom-table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // 核心修正：直接寫入要求的 11 位新參賽者與對應初始血量
        const defaultParticipants = [
            { name: "emily", hp: 2 },
            { name: "jamie", hp: 11 },
            { name: "怡", hp: 9 },
            { name: "wei", hp: 11 },
            { name: "羊", hp: 1 },
            { name: "大學", hp: 8 },
            { name: "難", hp: 5 },
            { name: "翠翠", hp: 11 },
            { name: "呱", hp: 6 },
            { name: "alisa", hp: 8 },
            { name: "九同", hp: 1 }
        ];
        
        // 核心修正：血量上限預設改為 11
        const defaultMaxHp = 11;
        const defaultTotalRounds = 10;

        let participants = []; // 正式封存資料
        let scratchpad = [];   // 當前畫面的即時草稿暫存區

        let maxHp = 11;
        let totalRounds = 10;
        let currentRound = 1; 
        let hasUnsavedChanges = false;

        // 初始化
        function init() {
            const savedPlayers = localStorage.getItem('sk_tour_v10_players');
            const savedMaxHp = localStorage.getItem('sk_tour_v10_maxhp');
            const savedTotalRounds = localStorage.getItem('sk_tour_v10_totalrounds');

            maxHp = savedMaxHp ? parseInt(savedMaxHp) : defaultMaxHp;
            document.getElementById('max-hp-input').value = maxHp;
            totalRounds = savedTotalRounds ? parseInt(savedTotalRounds) : defaultTotalRounds;

            if (savedPlayers) {
                participants = JSON.parse(savedPlayers);
            } else {
                participants = defaultParticipants.map(p => ({
                    name: p.name,
                    hp: p.hp,
                    roundScores: Array(totalRounds).fill(0),
                    totalPoints: 0,
                    rank: 1
                }));
                // 首次載入計算總分排名，並套用血量/積分雙層權重排序
                calculateTotalAndRanks(participants);
                sortParticipantsArray(participants);
            }

            participants.forEach(p => {
                if(!p.roundScores) p.roundScores = [];
                while(p.roundScores.length < totalRounds) p.roundScores.push(0);
            });

            scratchpad = JSON.parse(JSON.stringify(participants));
            hasUnsavedChanges = false;

            updateRoundDropdown();
            renderUI();
            buildSetupForm();
        }

        // 展開/收合設定選單
        function toggleSetupSection() {
            const sect = document.getElementById('setup-section');
            sect.style.display = (sect.style.display === 'block') ? 'none' : 'block';
        }

        // 重繪表單設定欄位
        function buildSetupForm() {
            const container = document.getElementById('player-inputs-list');
            container.innerHTML = '';
            scratchpad.forEach(p => {
                addPlayerInputRow(p.name, p.hp);
            });
        }

        function addPlayerInputRow(name = '', hp = 11) {
            const container = document.getElementById('player-inputs-list');
            const row = document.createElement('div');
            row.className = 'player-input-row';
            row.innerHTML = `
                <label>參賽者名稱：</label>
                <input type="text" placeholder="輸入名稱" value="${name}" class="setup-name-input">
                <label>初始血量：</label>
                <input type="number" min="0" value="${hp}" class="setup-hp-input">
                <button type="button" class="btn-hp-sub" style="padding: 6px 10px;" onclick="this.parentElement.remove()">❌ 刪除</button>
            `;
            container.appendChild(row);
        }

        function importCustomNewTournament() {
            const rows = document.querySelectorAll('.player-input-row');
            let newPlayersList = [];
            
            for(let i = 0; i < rows.length; i++) {
                let name = rows[i].querySelector('.setup-name-input').value.trim();
                let hp = parseInt(rows[i].querySelector('.setup-hp-input').value);
                
                if (name === '') {
                    alert("導入失敗：參賽者名稱不能為空！");
                    return;
                }
                if (isNaN(hp) || hp < 0) hp = 0;
                
                newPlayersList.push({ name: name, hp: hp });
            }

            if(newPlayersList.length === 0) {
                alert("導入失敗：至少需要填寫一名參賽者！");
                return;
            }

            if(confirm("🔥 警告：導入新名單會完全重置並清除目前所有局數分數，確定要繼續嗎？")) {
                participants = newPlayersList.map(p => ({
                    name: p.name,
                    hp: p.hp,
                    roundScores: Array(totalRounds).fill(0),
                    totalPoints: 0,
                    rank: 1
                }));
                
                calculateTotalAndRanks(participants);
                sortParticipantsArray(participants);
                
                scratchpad = JSON.parse(JSON.stringify(participants));
                hasUnsavedChanges = false;
                saveToLocalStorage();
                renderUI();
                
                document.getElementById('setup-section').style.display = 'none';
                alert("🎉 新名單已順利導入並同步！");
            }
        }

        function updateRoundDropdown() {
            const select = document.getElementById('round-select');
            select.innerHTML = '';
            for (let i = 1; i <= totalRounds; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `第 ${i} 局`;
                if (i === currentRound) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function changeCurrentRound(val) {
            currentRound = parseInt(val);
            renderTopTable(); 
        }

        function addNewRound() {
            if(hasUnsavedChanges) {
                if(!confirm("目前有未發布的變更，新增局數將會自動發布並保存當前更動，是否繼續？")) return;
                commitChanges();
            }
            totalRounds++;
            participants.forEach(p => p.roundScores.push(0));
            scratchpad.forEach(p => p.roundScores.push(0));
            currentRound = totalRounds;
            updateRoundDropdown();
            commitChanges(); 
        }

        function saveToLocalStorage() {
            localStorage.setItem('sk_tour_v10_players', JSON.stringify(participants));
            localStorage.setItem('sk_tour_v10_maxhp', maxHp.toString());
            localStorage.setItem('sk_tour_v10_totalrounds', totalRounds.toString());
        }

        function resetToDefault() {
            if (confirm("確定要將本場賽事完全重設至最初始的狀態嗎？")) {
                localStorage.removeItem('sk_tour_v10_players');
                localStorage.removeItem('sk_tour_v10_maxhp');
                localStorage.removeItem('sk_tour_v10_totalrounds');
                document.getElementById('max-hp-input').value = defaultMaxHp;
                totalRounds = defaultTotalRounds;
                currentRound = 1;
                init();
            }
        }

        function updateMaxHp(value) {
            let val = parseInt(value);
            if (!isNaN(val) && val > 0) {
                maxHp = val;
                localStorage.setItem('sk_tour_v10_maxhp', maxHp.toString());
                renderTopTable();
            }
        }

        function calculateTotalAndRanks(targetArray) {
            targetArray.forEach(p => {
                p.totalPoints = p.roundScores.reduce((sum, score) => sum + score, 0);
            });
            let sorted = [...targetArray].sort((a, b) => b.totalPoints - a.totalPoints);
            let currentRank = 1;
            for (let i = 0; i < sorted.length; i++) {
                if (i > 0 && sorted[i].totalPoints < sorted[i - 1].totalPoints) {
                    currentRank = i + 1;
                }
                let originalObj = targetArray.find(p => p.name === sorted[i].name);
                if (originalObj) originalObj.rank = currentRank;
            }
        }

        // 雙重排序邏輯 (第一條件：血量高到低；第二條件：總積分高到低)
        function sortParticipantsArray(targetArray) {
            targetArray.sort((a, b) => {
                if (b.hp !== a.hp) {
                    return b.hp - a.hp;
                }
                return b.totalPoints - a.totalPoints;
            });
        }

        // 修改暫存草稿區，發布前行數位置完全鎖定，避免賽事人員狂按時點錯行
        function changeValue(name, type, amount) {
            let player = scratchpad.find(p => p.name === name);
            if (player) {
                if (type === 'hp') {
                    player.hp = Math.max(0, player.hp + amount);
                } else if (type === 'points') {
                    player.roundScores[currentRound - 1] = Math.max(0, player.roundScores[currentRound - 1] + amount);
                }
                checkUnsavedChanges();
                renderTopTable(); 
            }
        }

        function customEdit(name) {
            let player = scratchpad.find(p => p.name === name);
            if (player) {
                let newHp = prompt(`請輸入【${player.name}】的最新血量：`, player.hp);
                if (newHp !== null && newHp.trim() !== "" && !isNaN(newHp)) {
                    player.hp = Math.max(0, parseInt(newHp));
                }
                let currentRoundScore = player.roundScores[currentRound - 1];
                let newScore = prompt(`請輸入【${player.name}】在【第 ${currentRound} 局】的得分：`, currentRoundScore);
                if (newScore !== null && newScore.trim() !== "" && !isNaN(newScore)) {
                    player.roundScores[currentRound - 1] = Math.max(0, parseInt(newScore));
                }
                checkUnsavedChanges();
                renderTopTable();
            }
        }

        function checkUnsavedChanges() {
            let isDifferent = false;
            for (let i = 0; i < scratchpad.length; i++) {
                let p = participants.find(orig => orig.name === scratchpad[i].name);
                if (p) {
                    if (p.hp !== scratchpad[i].hp) isDifferent = true;
                    if (JSON.stringify(p.roundScores) !== JSON.stringify(scratchpad[i].roundScores)) isDifferent = true;
                }
            }
            hasUnsavedChanges = isDifferent;
            const btn = document.getElementById('main-submit-btn');
            if (hasUnsavedChanges) {
                btn.classList.add('glow');
                btn.innerText = "💾 內容已變更：點此發布更新";
            } else {
                btn.classList.remove('glow');
                btn.innerText = "🚀 確定發布變更";
            }
        }

        // 🚀 大確認送出：依照血量與分數加權，對控制面板及明細重新做大重組排序
        function commitChanges() {
            participants = JSON.parse(JSON.stringify(scratchpad));
            calculateTotalAndRanks(participants);
            
            // 執行雙權重排序演算法
            sortParticipantsArray(participants);
            
            // 同步回暫存區，使其在發布的一瞬間更新為完美的名次行數
            scratchpad = JSON.parse(JSON.stringify(participants));
            
            hasUnsavedChanges = false;
            const btn = document.getElementById('main-submit-btn');
            btn.classList.remove('glow');
            btn.innerText = "🚀 確定發布變更";

            saveToLocalStorage();
            renderUI();
            buildSetupForm();
            alert("✅ 排行榜已依照全新數據洗牌更新（主要依據：血量；次要依據：積分）");
        }

        function renderUI() {
            renderTopTable();
            renderBottomTable();
        }

        function renderTopTable() {
            const tbody = document.getElementById('top-table-body');
            tbody.innerHTML = '';

            participants.forEach(origPlayer => {
                let p = scratchpad.find(item => item.name === origPlayer.name);
                if(!p) return;
                
                let isHpDirty = p.hp !== origPlayer.hp;
                let tempTotalPoints = p.roundScores.reduce((s, c) => s + c, 0);
                let isPointsDirty = JSON.stringify(p.roundScores) !== JSON.stringify(origPlayer.roundScores);

                const tr = document.createElement('tr');

                let rankClass = '';
                if (origPlayer.rank === 1) rankClass = 'rank-1';
                else if (origPlayer.rank === 2) rankClass = 'rank-2';
                else if (origPlayer.rank === 3) rankClass = 'rank-3';

                let hpPercent = Math.min((p.hp / maxHp) * 100, 100);
                if (hpPercent < 0) hpPercent = 0;

                tr.innerHTML = `
                    <td><strong>${p.name}</strong></td>
                    <td class="${isHpDirty ? 'dirty-cell' : ''}">
                        <span style="display:inline-block; width:35px; text-align:right; font-weight:bold;">${p.hp}</span>
                        ${isHpDirty ? '<span style="color:#ffa502">⚠️</span>' : ''}
                        <div class="hp-bar-container">
                            <div class="hp-bar" style="width: ${hpPercent}%;"></div>
                        </div>
                    </td>
                    <td class="${isPointsDirty ? 'dirty-cell' : ''}" style="font-weight: bold; color: #ffa502;">
                        ${tempTotalPoints} 分 ${isPointsDirty ? '<span style="font-size:0.8rem;color:#ffa502">(✏️)</span>' : ''}
                    </td>
                    <td class="${rankClass}">第 ${origPlayer.rank} 名</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-hp-add" onclick="changeValue('${p.name}', 'hp', 1)">+1 血</button>
                            <button class="btn-hp-sub" onclick="changeValue('${p.name}', 'hp', -1)">-1 血</button>
                            <button class="btn-pt-add" onclick="changeValue('${p.name}', 'points', 1)">+1 分 (局${currentRound})</button>
                            <button class="btn-pt-sub" onclick="changeValue('${p.name}', 'points', -1)">-1 分 (局${currentRound})</button>
                            <button class="btn-edit" onclick="customEdit('${p.name}')">✏️ 自訂</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderBottomTable() {
            const thead = document.getElementById('bottom-table-head');
            let headHtml = `<tr><th>參賽者</th>`;
            for (let i = 1; i <= totalRounds; i++) {
                headHtml += `<th>第 ${i} 局</th>`;
            }
            headHtml += `<th>總名次</th></tr>`;
            thead.innerHTML = headHtml;

            const tbody = document.getElementById('bottom-table-body');
            tbody.innerHTML = '';

            participants.forEach(p => {
                const tr = document.createElement('tr');

                let rankClass = '';
                if (p.rank === 1) rankClass = 'rank-1';
                else if (p.rank === 2) rankClass = 'rank-2';
                else if (p.rank === 3) rankClass = 'rank-3';

                let scoresTdHtml = '';
                p.roundScores.forEach(score => {
                    let cellClass = score > 0 ? 'round-cell has-value' : 'round-cell';
                    scoresTdHtml += `<td class="${cellClass}">${score}</td>`;
                });

                tr.innerHTML = `
                    <td><strong>${p.name}</strong></td>
                    ${scoresTdHtml}
                    <td class="${rankClass}">第 ${p.rank} 名</td>
                `;
                tbody.appendChild(tr);
            });
        }

        init();
    </script>
</body>
</html>
