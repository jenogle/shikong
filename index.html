<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>失控事務所積分錦標賽</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #fff; --accent: #ff4757; --th: #2f3542; --hover: #2d2d2d; --dirty: #ffa502; }
        body { font-family: 'Share Tech Mono', 'Noto Sans TC', monospace, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: var(--accent); font-size: 2.5rem; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255, 71, 87, 0.4); text-align: center; }
        
        /* 修正核心：將 h2 標題完全置中，並優化底線裝飾 */
        h2 { color: #ffa502; font-size: 1.4rem; margin: 25px 0 15px; width: 100%; max-width: 1150px; text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 8px; letter-spacing: 1px; }
        
        .container { width: 100%; max-width: 1150px; background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); box-sizing: border-box; margin-bottom: 20px; border: 1px solid #333; }
        .table-wrapper { width: 100%; overflow-x: auto; }
        .config-bar { width: 100%; max-width: 1150px; background: var(--th); padding: 15px 20px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; flex-wrap: wrap; gap: 15px; }
        .config-left { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        input, select { background: #121212; border: 1px solid #555; color: #fff; padding: 8px 12px; border-radius: 4px; font-size: 1rem; font-weight: bold; font-family: inherit; text-align: center; }
        select { color: #1e90ff; cursor: pointer; }
        .config-bar input { width: 60px; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 1.1rem; }
        th, td { padding: 14px 10px; border-bottom: 1px solid #333; vertical-align: middle; white-space: nowrap; text-align: center; }
        th { background: var(--th); color: #ffa502; font-weight: bold; }
        tbody tr:hover { background: var(--hover); }
        .dirty-cell { background: rgba(255, 165, 2, 0.15) !important; border: 2px dashed var(--dirty) !important; border-radius: 6px; }
        .rank-1 { color: #ffd700; font-weight: bold; font-size: 1.4rem; text-shadow: 0 0 5px rgba(255,215,0,0.3); }
        .rank-2 { color: #c0c0c0; font-weight: bold; font-size: 1.25rem; }
        .rank-3 { color: #cd7f32; font-weight: bold; font-size: 1.15rem; }
        .hp-container { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .hp-bar-container { width: 80px; background: #444; border-radius: 4px; overflow: hidden; display: inline-block; }
        .hp-bar { height: 10px; background: #2ed573; transition: width 0.2s; }
        .round-cell { color: #1e90ff; font-weight: bold; }
        .round-cell.has-value { color: #ffa502; }
        .action-btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
        button { border: none; border-radius: 4px; padding: 7px 14px; font-weight: bold; cursor: pointer; color: #fff; transition: transform 0.1s, opacity 0.2s; font-size: 0.9rem; font-family: inherit; text-align: center; }
        button:active { transform: scale(0.95); }
        button:hover { opacity: 0.9; }
        .btn-hp-add { background: #2ed573; color: #000; }
        .btn-hp-sub { background: #ff4757; }
        .btn-pt-add { background: #1e90ff; }
        .btn-pt-sub { background: #ff6348; }
        .btn-add-round { background: #2ed573; color: #000; }
        .btn-edit { background: #57606f; }
        .btn-reset { background: #57606f; color: #fff; padding: 6px 10px; font-size: 0.85rem;}
        .btn-submit-all { background: #ffa502; color: #000; font-size: 1rem; padding: 8px 20px; border-radius: 6px; box-shadow: 0 0 15px rgba(255, 165, 2, 0.4); }
        .btn-submit-all.glow { animation: buttonGlow 1s infinite alternate; background: #2ed573; }
        @keyframes buttonGlow { from { box-shadow: 0 0 5px #2ed573; } to { box-shadow: 0 0 20px #2ed573; } }
    </style>
</head>
<body>

    <h1>失控事務所積分錦標賽</h1>

    <div class="config-bar">
        <div class="config-left">
            <div class="config-item"><label>🩸 血量上限：</label><input type="number" id="max-hp-input" value="11" min="1" oninput="updateMaxHp(this.value)"></div>
            <div class="config-item"><label>🎮 目前管理：</label><select id="round-select" onchange="currentRound = parseInt(this.value); renderTopTable();"></select></div>
            <button class="btn-add-round" onclick="addNewRound()">➕ 新增局數</button>
            <button class="btn-reset" onclick="resetToDefault()">🔄 全賽局重設</button>
        </div>
        <button id="main-submit-btn" class="btn-submit-all" onclick="commitChanges()">🚀 確定發布變更</button>
    </div>

    <h2>⚔️ 實時對戰操作面板 (發布後依血量及積分刷新排序)</h2>
    <div class="container"><div class="table-wrapper"><table>
        <thead><tr><th>參賽者</th><th>血量 (▼1)</th><th>已獲得積分 (▼2)</th><th>名次</th><th>操作 (僅修改暫存)</th></tr></thead>
        <tbody id="top-table-body"></tbody>
    </table></div></div>

    <h2>📊 各局得分明細數據大表 (依總分數排名由高到低排列)</h2>
    <div class="container"><div class="table-wrapper"><table>
        <thead id="bottom-table-head"></thead>
        <tbody id="bottom-table-body"></tbody>
    </table></div></div>

    <script>
        const defaultParticipants = [
            { name: "emily", hp: 2 }, { name: "jamie", hp: 11 }, { name: "怡", hp: 9 }, { name: "wei", hp: 11 }, { name: "羊", hp: 1 },
            { name: "大學", hp: 8 }, { name: "難", hp: 5 }, { name: "翠翠", hp: 11 }, { name: "呱", hp: 6 }, { name: "alisa", hp: 8 }, { name: "九同", hp: 1 }
        ];
        const defaultMaxHp = 11, defaultTotalRounds = 10;
        let participants = [], scratchpad = [], maxHp = 11, totalRounds = 10, currentRound = 1, hasUnsavedChanges = false;

        const clone = (arr) => JSON.parse(JSON.stringify(arr));
        const getSum = (arr) => arr.reduce((s, c) => s + c, 0);
        const getRankClass = (rank) => rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';

        function init() {
            maxHp = parseInt(localStorage.getItem('sk_tour_v12_maxhp')) || defaultMaxHp;
            totalRounds = parseInt(localStorage.getItem('sk_tour_v12_totalrounds')) || defaultTotalRounds;
            document.getElementById('max-hp-input').value = maxHp;

            const saved = localStorage.getItem('sk_tour_v12_players');
            if (saved) {
                participants = JSON.parse(saved);
            } else {
                participants = defaultParticipants.map(p => ({ ...p, roundScores: Array(totalRounds).fill(0), totalPoints: 0, rank: 1 }));
                calculateRanks(participants);
                sortParticipants(participants);
            }
            participants.forEach(p => { while(p.roundScores.length < totalRounds) p.roundScores.push(0); });
            scratchpad = clone(participants);
            updateRoundDropdown();
            renderUI();
        }

        function updateRoundDropdown() {
            const select = document.getElementById('round-select');
            select.innerHTML = Array.from({length: totalRounds}, (_, i) => `<option value="${i+1}" ${i+1===currentRound?'selected':''}>第 ${i+1} 局</option>`).join('');
        }

        function addNewRound() {
            if (hasUnsavedChanges && !confirm("有未發布變更，將自動發布。確定繼續？")) return;
            if (hasUnsavedChanges) commitChanges();
            totalRounds++;
            [participants, scratchpad].forEach(arr => arr.forEach(p => p.roundScores.push(0)));
            currentRound = totalRounds;
            updateRoundDropdown();
            commitChanges(); 
        }

        function resetToDefault() {
            if (confirm("確定要全賽局重設嗎？")) {
                localStorage.clear();
                currentRound = 1;
                init();
            }
        }

        function updateMaxHp(val) {
            maxHp = parseInt(val) || defaultMaxHp;
            localStorage.setItem('sk_tour_v12_maxhp', maxHp);
            renderTopTable();
        }

        function calculateRanks(arr) {
            arr.forEach(p => p.totalPoints = getSum(p.roundScores));
            let sorted = [...arr].sort((a, b) => b.totalPoints - a.totalPoints);
            sorted.forEach((p, i) => {
                let rank = (i > 0 && p.totalPoints === sorted[i - 1].totalPoints) ? arr.find(o => o.name === sorted[i - 1].name).rank : i + 1;
                arr.find(o => o.name === p.name).rank = rank;
            });
        }

        function sortParticipants(arr) {
            arr.sort((a, b) => (b.hp !== a.hp) ? b.hp - a.hp : b.totalPoints - a.totalPoints);
        }

        function changeValue(name, type, amount) {
            let p = scratchpad.find(o => o.name === name);
            if (type === 'hp') p.hp = Math.max(0, p.hp + amount);
            if (type === 'points') p.roundScores[currentRound - 1] = Math.max(0, p.roundScores[currentRound - 1] + amount);
            checkChanges();
        }

        function customEdit(name) {
            let p = scratchpad.find(o => o.name === name);
            let nhp = prompt(`請輸入 ${p.name} 最新血量：`, p.hp);
            if (nhp && !isNaN(nhp)) p.hp = Math.max(0, parseInt(nhp));
            let nsc = prompt(`請輸入第 ${currentRound} 局得分：`, p.roundScores[currentRound - 1]);
            if (nsc && !isNaN(nsc)) p.roundScores[currentRound - 1] = Math.max(0, parseInt(nsc));
            checkChanges();
        }

        function checkChanges() {
            hasUnsavedChanges = scratchpad.some(p => {
                let o = participants.find(orig => orig.name === p.name);
                return o.hp !== p.hp || JSON.stringify(o.roundScores) !== JSON.stringify(p.roundScores);
            });
            const btn = document.getElementById('main-submit-btn');
            btn.className = `btn-submit-all ${hasUnsavedChanges ? 'glow' : ''}`;
            btn.innerText = hasUnsavedChanges ? "💾 內容已變更：點此發布" : "🚀 確定發布變更";
            renderTopTable();
        }

        function commitChanges() {
            participants = clone(scratchpad);
            calculateRanks(participants);
            sortParticipants(participants);
            scratchpad = clone(participants);

            let oldRound = currentRound;
            if (currentRound < totalRounds) currentRound++;
            else { totalRounds++; [participants, scratchpad].forEach(arr => arr.forEach(p => p.roundScores.push(0))); currentRound = totalRounds; }

            hasUnsavedChanges = false;
            document.getElementById('main-submit-btn').className = "btn-submit-all";
            document.getElementById('main-submit-btn').innerText = "🚀 確定發布變更";

            updateRoundDropdown();
            localStorage.setItem('sk_tour_v12_players', JSON.stringify(participants));
            localStorage.setItem('sk_tour_v12_totalrounds', totalRounds);
            renderUI();
            alert(`✅ 第 ${oldRound} 局數據發布成功！系統已自動切換至【第 ${currentRound} 局】。`);
        }

        function renderUI() { renderTopTable(); renderBottomTable(); }

        function renderTopTable() {
            const tbody = document.getElementById('top-table-body');
            tbody.innerHTML = participants.map(orig => {
                let p = scratchpad.find(o => o.name === orig.name);
                let isHpDirty = p.hp !== orig.hp, isPtDirty = JSON.stringify(p.roundScores) !== JSON.stringify(orig.roundScores);
                return `<tr>
                    <td><strong>${p.name}</strong></td>
                    <td class="${isHpDirty?'dirty-cell':''}"><div class="hp-container"><span style="display:inline-block;width:35px;text-align:right;">${p.hp}</span>${isHpDirty?'⚠️':''}<div class="hp-bar-container"><div class="hp-bar" style="width:${Math.min((p.hp/maxHp)*100,100)}%;"></div></div></div></td>
                    <td class="${isPtDirty?'dirty-cell':''}" style="color:#ffa502;font-weight:bold;">${getSum(p.roundScores)} 分 ${isPtDirty?'(✏️)':''}</td>
                    <td class="${getRankClass(orig.rank)}">第 ${orig.rank} 名</td>
                    <td><div class="action-btns">
                        <button class="btn-hp-add" onclick="changeValue('${p.name}','hp',1)">+1 血</button><button class="btn-hp-sub" onclick="changeValue('${p.name}','hp',-1)">-1 血</button>
                        <button class="btn-pt-add" onclick="changeValue('${p.name}','points',1)">+1 分</button><button class="btn-pt-sub" onclick="changeValue('${p.name}','points',-1)">-1 分</button>
                        <button class="btn-edit" onclick="customEdit('${p.name}')">✏️ 自訂</button>
                    </div></td>
                </tr>`;
            }).join('');
        }

        function renderBottomTable() {
            document.getElementById('bottom-table-head').innerHTML = `<tr><th>參賽者</th>${Array.from({length:totalRounds},(_,i)=>`<th>第 ${i+1} 局</th>`).join('')}<th>總積分</th><th>總名次</th></tr>`;
            document.getElementById('bottom-table-body').innerHTML = [...participants].sort((a,b)=>b.totalPoints - a.totalPoints).map(p => `<tr>
                <td><strong>${p.name}</strong></td>
                ${p.roundScores.map(s => `<td class="round-cell ${s>0?'has-value':''}">${s}</td>`).join('')}
                <td style="font-weight:bold;color:#ffa502;">${p.totalPoints} 分</td>
                <td class="${getRankClass(p.rank)}">第 ${p.rank} 名</td>
            </tr>`).join('');
        }

        init();
    </script>
</body>
</html>
